services:
  web:
    image: ${GOSPEED_IMAGE:?Set GOSPEED_IMAGE to an immutable release tag}
    container_name: gospeed-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GOSPEED_APP_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
